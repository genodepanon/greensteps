[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.json", "php82Extensions.bcmath", "php82Extensions.fileinfo", "php82Extensions.openssl", "php82Extensions.curl"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-scripts"]

[phases.build]
cmds = [
  "mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs",
  "php artisan config:clear"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"